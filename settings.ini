[display]
width = 1280
height = 720
fullscreen = no
# zoom: "auto" = 1.5 with D2 graphics, 2 with placeholder art. Mouse wheel changes it in game.
scale = auto

[diablo2]
# Folder of your Diablo II install (the one containing d2data.mpq).
# Leave empty to play with placeholder art.
path = C:\GOG Games\Diablo II

[game]
# normal, nightmare or hell - monster stats come straight from D2's tables for that difficulty
difficulty = normal
# lowest chance to hit for your attacks in percent (D2's own formula is very harsh early on).
# 5 = original D2 odds
min_hit_chance = 60
# action points one melee attack costs (shots with bows / javelins cost one more)
melee_ap = 1
